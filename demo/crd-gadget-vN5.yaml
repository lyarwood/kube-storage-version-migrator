apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.demo.example.com
spec:
  group: demo.example.com
  names:
    kind: Gadget
    listKind: GadgetList
    plural: gadgets
    singular: gadget
  scope: Namespaced
  conversion:
    strategy: None
  versions:
  # Simulates the CRD as it exists at version N+5 after a skip-level upgrade.
  #
  # Evolution across cluster versions:
  #   N   — v1alpha1 introduced: name, debugMode, legacyPort, internalRef
  #   N+2 — v1beta1 added, debugMode removed (was experimental)
  #   N+3 — legacyPort removed from v1beta1 (replaced by a Service)
  #   N+4 — v1 added, internalRef removed (moved to status)
  #   N+5 — v1 becomes storage
  - name: v1alpha1
    served: true
    storage: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              debugMode:
                type: boolean
              legacyPort:
                type: integer
              internalRef:
                type: string
  - name: v1beta1
    served: true
    storage: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              internalRef:
                type: string
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
