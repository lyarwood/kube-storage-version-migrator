apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.demo.example.com
spec:
  group: demo.example.com
  names:
    kind: Gadget
    listKind: GadgetList
    plural: gadgets
    singular: gadget
  scope: Namespaced
  conversion:
    strategy: None
  versions:
  # Version N introduces the API group with v1alpha1 as the only version.
  # All fields are present.
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              debugMode:
                type: boolean
              legacyPort:
                type: integer
              internalRef:
                type: string
